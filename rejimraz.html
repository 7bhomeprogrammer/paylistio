<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Режим разработчика</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {margin:0;font-family:'Poppins',sans-serif;background:#f5f6fa;color:#2f3640;display:flex;justify-content:center;align-items:center;height:100vh;}
.login-container {background:#1e1e2f;color:#fff;padding:30px;border-radius:12px;width:320px;}
.login-container h2 {text-align:center;margin-bottom:20px;}
.login-container input {width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;}
.login-container button {width:100%;padding:10px;margin-top:10px;background:#0984e3;border:none;color:#fff;border-radius:6px;cursor:pointer;}
.login-container button:hover {background:#74b9ff;}
#error-msg {color:red;display:none;margin-top:5px;text-align:center;}
.panel {display:none;margin-top:20px;background:#fff;color:#000;padding:15px;border-radius:12px;width:350px;}
.panel button {width:100%;padding:8px;margin:5px 0;border:none;border-radius:6px;cursor:pointer;}
.panel .exit-btn {background:#e74c3c;color:#fff;}
#complaints-box {margin-top:10px;background:#f0f0f0;padding:10px;border-radius:8px;max-height:200px;overflow:auto;display:none;}
#complaints-box p {margin:5px 0;}
</style>
</head>
<body>

<div class="login-container" id="login-container">
  <h2>Вход в Режим разработчика</h2>
  <input type="text" id="username" placeholder="Логин" required>
  <input type="password" id="password" placeholder="Пароль" required>
  <button id="login-btn">Войти</button>
  <p id="error-msg">Неверный логин или пароль</p>
</div>

<div class="panel" id="dev-panel">
  <h3>Панель разработчика</h3>
  <button onclick="alert('Исправление ошибок')">Исправление ошибок</button>
  <button onclick="showComplaints()">Жалобы</button>
  <div id="complaints-box">
    <p>Все жалобы отправляются на e-mail: <strong>salievazatbek14@gmail.com</strong></p>
    <p>Вы можете просмотреть их в почтовом ящике.</p>
  </div>
  <button class="exit-btn" onclick="logout()">Выйти</button>
</div>

<script>
const users = {
  "azatcoder":"1123a",
  "magasiyay":"1234a"
};

const loginBtn = document.getElementById('login-btn');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('error-msg');
const loginContainer = document.getElementById('login-container');
const devPanel = document.getElementById('dev-panel');
const complaintsBox = document.getElementById('complaints-box');

loginBtn.addEventListener('click', ()=>{
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  
  if(users[username] && users[username] === password){
    errorMsg.style.display='none';
    loginContainer.style.display='none';
    devPanel.style.display='block';
  } else {
    errorMsg.style.display='block';
  }
});

function logout(){
  devPanel.style.display='none';
  loginContainer.style.display='block';
  usernameInput.value='';
  passwordInput.value='';
  complaintsBox.style.display='none';
}

function showComplaints(){
  complaintsBox.style.display = 'block';
}
</script>

</body>
</html>
